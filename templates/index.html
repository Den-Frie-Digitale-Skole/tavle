<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Whiteboard</title>

    <!-- Tailwind CSS (local) -->
    <script src="/static/js/vendor/tailwind.js"></script>

    <!-- Whiteboard CSS -->
    <link rel="stylesheet" href="/static/css/whiteboard.css">

    <!-- Alpine.js (local) -->
    <script defer src="/static/js/vendor/alpine.min.js"></script>

    <!-- Socket.IO (local) -->
    <script src="/static/js/vendor/socket.io.min.js"></script>

    <!-- Perfect Freehand - Load via ES module (local) -->
    <script type="module">
        import { getStroke } from '/static/js/vendor/perfect-freehand.mjs';
        window.getStroke = getStroke;
        window.dispatchEvent(new Event('perfect-freehand-ready'));
    </script>

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

</head>

<body class="bg-gray-100 overflow-hidden">
    <!-- Main Whiteboard Component -->
    <div x-data="whiteboardApp()" x-init="init()" class="whiteboard-container" :data-mode="mode">

        <!-- Dual Canvas System -->
        <canvas x-ref="baseCanvas" class="whiteboard-canvas whiteboard-canvas--base"></canvas>
        <canvas x-ref="activeCanvas" class="whiteboard-canvas whiteboard-canvas--active"></canvas>

        <!-- Floating Tool Palette - Excalidraw Style -->
        <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50">
            <div class="flex items-center gap-1 px-2 py-2 bg-white rounded-xl shadow-lg border border-gray-200/80">

                <!-- Tool Selection -->
                <div class="flex items-center gap-0.5 px-1">
                    <button @click="setMode('draw')"
                        :class="mode === 'draw' ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 rounded-lg transition-all duration-150" title="Draw (D)">
                        <i class="ph ph-pencil-simple text-xl"></i>
                    </button>
                    <button @click="setMode('erase')"
                        :class="mode === 'erase' ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 rounded-lg transition-all duration-150" title="Eraser (E)">
                        <i class="ph ph-eraser text-xl"></i>
                    </button>
                    <button @click="setMode('select')"
                        :class="mode === 'select' ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 rounded-lg transition-all duration-150" title="Select (V)">
                        <i class="ph ph-cursor text-xl"></i>
                    </button>
                    <button @click="setMode('pan')"
                        :class="mode === 'pan' ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 rounded-lg transition-all duration-150" title="Pan (H)">
                        <i class="ph ph-hand text-xl"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="w-px h-8 bg-gray-200 mx-1"></div>

                <!-- Stroke Color -->
                <div class="flex items-center gap-1 px-1">
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" 
                            class="w-8 h-8 rounded-lg border-2 border-gray-200 hover:border-gray-300 transition-colors flex items-center justify-center"
                            :style="{ backgroundColor: color }">
                        </button>
                        <!-- Color Dropdown -->
                        <div x-show="open" @click.outside="open = false" x-transition
                            class="absolute top-full left-0 mt-2 p-4 bg-white rounded-xl shadow-xl border border-gray-200 z-50 min-w-[220px]">
                            <p class="text-xs font-medium text-gray-500 mb-3">Stroke Color</p>
                            <div class="grid grid-cols-5 gap-2 mb-4">
                                <template x-for="c in colorPalette" :key="c">
                                    <button @click="setColor(c); open = false" 
                                        :style="{ backgroundColor: c }"
                                        :class="color === c ? 'ring-2 ring-violet-500 ring-offset-2' : ''"
                                        class="w-9 h-9 rounded-lg border border-gray-200 hover:scale-110 transition-transform cursor-pointer">
                                    </button>
                                </template>
                            </div>
                            <div class="pt-3 border-t border-gray-100">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <span class="text-xs text-gray-500">Custom:</span>
                                    <input type="color" x-model="color" @input="setColor($event.target.value)"
                                        class="w-10 h-8 rounded cursor-pointer border border-gray-200">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="w-px h-8 bg-gray-200 mx-1"></div>

                <!-- Stroke Width Presets -->
                <div class="flex items-center gap-1 px-1">
                    <template x-for="sw in strokeWidths" :key="sw.value">
                        <button @click="setStrokeWidth(sw.value)"
                            :class="strokeWidth == sw.value ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-500'"
                            class="w-9 h-9 rounded-lg transition-all duration-150 flex items-center justify-center"
                            :title="sw.label">
                            <div class="rounded-full bg-current" :style="{ width: sw.size + 'px', height: sw.size + 'px' }"></div>
                        </button>
                    </template>
                </div>

                <!-- Divider -->
                <div class="w-px h-8 bg-gray-200 mx-1"></div>

                <!-- Canvas Options -->
                <div class="flex items-center gap-0.5 px-1">
                    <!-- Background Color -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" 
                            :class="backgroundColor !== '#ffffff' ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-600'"
                            class="p-2.5 rounded-lg transition-all duration-150" title="Background Color">
                            <i class="ph ph-paint-bucket text-xl"></i>
                        </button>
                        <!-- Background Color Dropdown -->
                        <div x-show="open" @click.outside="open = false" x-transition
                            class="absolute top-full right-0 mt-2 p-3 bg-white rounded-xl shadow-xl border border-gray-200 z-50 min-w-[180px]">
                            <p class="text-xs font-medium text-gray-500 mb-2">Background</p>
                            <div class="grid grid-cols-5 gap-1.5">
                                <template x-for="bg in backgroundColors" :key="bg">
                                    <button @click="setBackgroundColor(bg); open = false" 
                                        :style="{ backgroundColor: bg }"
                                        :class="[
                                            backgroundColor === bg ? 'ring-2 ring-violet-500 ring-offset-1' : '',
                                            bg === '#ffffff' ? 'border border-gray-300' : ''
                                        ]"
                                        class="w-7 h-7 rounded-lg hover:scale-110 transition-transform">
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                    <!-- Grid Toggle -->
                    <button @click="toggleGrid()"
                        :class="showGrid ? 'bg-violet-100 text-violet-600' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 rounded-lg transition-all duration-150" title="Toggle Grid (G)">
                        <i class="ph ph-grid-four text-xl"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="w-px h-8 bg-gray-200 mx-1"></div>

                <!-- Zoom Controls -->
                <div class="flex items-center gap-0.5 px-1">
                    <button @click="zoomOut()" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600 transition-colors">
                        <i class="ph ph-minus text-lg"></i>
                    </button>
                    <button @click="resetZoom()" 
                        class="px-2 py-1 rounded-lg hover:bg-gray-100 text-gray-600 text-xs font-medium min-w-[50px] transition-colors"
                        x-text="Math.round(zoom * 100) + '%'">
                    </button>
                    <button @click="zoomIn()" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600 transition-colors">
                        <i class="ph ph-plus text-lg"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="w-px h-8 bg-gray-200 mx-1"></div>

                <!-- Actions -->
                <div class="flex items-center gap-0.5 px-1">
                    <input type="file" x-ref="imageInput" @change="uploadImage($event)" accept="image/*" class="hidden">
                    <button @click="$refs.imageInput.click()" 
                        class="p-2.5 rounded-lg hover:bg-gray-100 text-gray-600 transition-colors"
                        title="Add Image (Ctrl+V to paste)">
                        <i class="ph ph-image text-xl"></i>
                    </button>
                    <button @click="clearCanvas()" 
                        class="p-2.5 rounded-lg hover:bg-red-50 text-gray-600 hover:text-red-500 transition-colors"
                        title="Clear Canvas">
                        <i class="ph ph-trash text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Connection Status -->
        <div class="fixed bottom-4 left-4 z-50">
            <div class="flex items-center gap-2 px-3 py-2 bg-white/90 backdrop-blur rounded-lg shadow-md border border-gray-200/80 text-sm"
                :class="connected ? 'text-emerald-600' : 'text-gray-400'">
                <i :class="connected ? 'ph ph-wifi-high' : 'ph ph-wifi-slash'" class="text-lg"></i>
                <span x-text="connected ? 'Connected' : 'Disconnected'"></span>
            </div>
        </div>

        <!-- User Panel (bottom right) -->
        <div class="fixed bottom-4 right-4 z-50" x-show="userName">
            <!-- Connected users panel -->
            <div class="bg-white/95 backdrop-blur rounded-xl shadow-lg border border-gray-200/80 overflow-hidden min-w-[200px]">
                <!-- Header with your name -->
                <div class="px-3 py-2.5 bg-gray-50/80 border-b border-gray-200/80 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full ring-2 ring-white shadow-sm" :style="{ backgroundColor: userColor }"></div>
                        <span class="text-sm font-medium text-gray-700" x-text="userName"></span>
                        <span class="text-xs text-gray-400">(you)</span>
                        <button @click="editUserName()" 
                            class="p-1 text-gray-400 hover:text-violet-500 transition-colors"
                            title="Edit name">
                            <i class="ph ph-pencil-simple text-sm"></i>
                        </button>
                    </div>
                    <button @click="toggleUserPanel()" 
                        class="text-gray-400 hover:text-gray-600 transition-colors">
                        <i class="ph ph-caret-down text-lg transition-transform" :class="userPanelExpanded ? 'rotate-180' : ''"></i>
                    </button>
                </div>

                <!-- User list -->
                <div x-show="userPanelExpanded" x-transition class="max-h-48 overflow-y-auto">
                    <template x-if="remoteUsers.length === 0">
                        <div class="px-3 py-3 text-sm text-gray-400 text-center">
                            No other users online
                        </div>
                    </template>
                    <template x-for="user in remoteUsers" :key="user.oduserId">
                        <div class="px-3 py-2 flex items-center justify-between hover:bg-gray-50/80 border-b border-gray-100 last:border-b-0">
                            <div class="flex items-center gap-2">
                                <div class="w-2.5 h-2.5 rounded-full" :style="{ backgroundColor: user.color }"></div>
                                <span class="text-sm text-gray-600" x-text="user.name"></span>
                            </div>
                            <button @click="jumpToUser(user.oduserId)" 
                                class="p-1 text-gray-400 hover:text-violet-500 transition-colors"
                                title="Jump to user's location">
                                <i class="ph ph-map-pin text-base"></i>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div x-show="loading && userName" x-transition class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-50">
            <div class="text-center">
                <i class="ph ph-circle-notch text-4xl text-violet-500 animate-spin"></i>
                <p class="mt-4 text-gray-600">Loading whiteboard...</p>
            </div>
        </div>

        <!-- Name Entry Modal (shown before whiteboard) -->
        <div x-show="!userName" class="absolute inset-0 bg-gradient-to-br from-violet-50 to-indigo-100 flex items-center justify-center z-[100]">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-violet-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="ph ph-user text-3xl text-violet-600"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Welcome to the Whiteboard</h1>
                    <p class="text-gray-500 mt-2">Enter your name to join the collaboration</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                        <input type="text" 
                            x-ref="nameInput"
                            x-model="userNameInput" 
                            @keydown.enter="setUserName()"
                            placeholder="Enter your name..."
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Or pick a fun name:</label>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="animal in suggestedNames" :key="animal">
                                <button @click="userNameInput = animal" 
                                    :class="userNameInput === animal ? 'bg-violet-100 border-violet-400 text-violet-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'"
                                    class="px-3 py-1.5 text-sm border rounded-full transition-colors">
                                    <span x-text="animal"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <button @click="setUserName()" 
                        :disabled="!userNameInput.trim()"
                        :class="userNameInput.trim() ? 'bg-violet-600 hover:bg-violet-700' : 'bg-gray-300 cursor-not-allowed'"
                        class="w-full py-3 text-white font-medium rounded-xl transition-colors mt-4">
                        Join Whiteboard
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Whiteboard & Sync Scripts -->
    <script src="/static/js/whiteboard.js"></script>
    <script src="/static/js/sync.js"></script>

    <script>
        // Alpine.js Component
        function whiteboardApp() {
            return {
                // State
                whiteboard: null,
                syncManager: null,
                tokenId: '{{ token_id }}',

                // UI State
                mode: 'draw',
                color: '#1e1e1e',
                strokeWidth: 2,
                zoom: 1,
                connected: false,
                loading: true,
                showGrid: true,
                backgroundColor: '#ffffff',

                // User state
                userName: '',  // Will be set in init() with sanitization
                userNameInput: '',
                userColor: '#3b82f6',
                remoteUsers: [],
                userPanelExpanded: true,

                // Suggested rare animal names
                suggestedNames: [
                    'Axolotl', 'Quokka', 'Pangolin', 'Okapi', 'Narwhal',
                    'Kakapo', 'Fossa', 'Dugong', 'Saola', 'Tarsier'
                ],

                // Extended color palette (Excalidraw-style)
                colorPalette: [
                    // Row 1 - Dark shades
                    '#1e1e1e', '#e03131', '#2f9e44', '#1971c2', '#9c36b5',
                    // Row 2 - Medium shades  
                    '#868e96', '#f08c00', '#0c8599', '#6741d9', '#c2255c',
                    // Row 3 - Light shades
                    '#ced4da', '#ffd43b', '#a9e34b', '#66d9e8', '#e599f7',
                ],

                // Background color options
                backgroundColors: [
                    '#ffffff', '#f8f9fa', '#fff5f5', '#f3f0ff', '#e7f5ff',
                    '#ebfbee', '#fff9db', '#343a40', '#212529', '#0d0d0d',
                ],

                // Stroke width presets
                strokeWidths: [
                    { value: 1, size: 4, label: 'Extra thin' },
                    { value: 2, size: 6, label: 'Thin' },
                    { value: 4, size: 8, label: 'Medium' },
                    { value: 8, size: 12, label: 'Thick' },
                    { value: 16, size: 16, label: 'Extra thick' },
                ],

                async init() {
                    // Load and sanitize stored user name
                    const storedName = localStorage.getItem('whiteboardUserName');
                    if (storedName) {
                        this.userName = this.sanitizeUserName(storedName);
                        // Update storage if sanitization changed the name
                        if (this.userName !== storedName) {
                            localStorage.setItem('whiteboardUserName', this.userName);
                        }
                    }

                    // Wait for perfect-freehand to be loaded
                    if (typeof getStroke !== 'function') {
                        await new Promise(resolve => {
                            window.addEventListener('perfect-freehand-ready', resolve, { once: true });
                            // Fallback timeout in case event already fired
                            setTimeout(resolve, 1000);
                        });
                    }

                    // If user already has a name saved, start the whiteboard
                    if (this.userName) {
                        await this.startWhiteboard();
                    }
                },

                async startWhiteboard() {
                    // Guard against accidental double-initialization.
                    // This can happen during dev (Flask debug reloader / hot reload) or if Alpine is started twice.
                    if (this._initialized) return;
                    this._initialized = true;

                    // Initialize Whiteboard
                    this.whiteboard = new Whiteboard(
                        this.$refs.baseCanvas,
                        this.$refs.activeCanvas,
                        { color: this.color, strokeWidth: this.strokeWidth }
                    );

                    // Initialize SyncManager with user info
                    this.syncManager = new SyncManager(this.whiteboard, this.tokenId, {
                        userName: this.userName
                    });

                    // Get user color from whiteboard
                    this.userColor = this.whiteboard.localUserColor;

                    // Update remote users list periodically
                    setInterval(() => {
                        if (this.whiteboard) {
                            this.remoteUsers = this.whiteboard.getRemoteUsers();
                        }
                    }, 500);

                    // Watch for zoom changes
                    const updateZoom = () => {
                        // If init ran twice somehow, the first loop will still be running.
                        // Bail out so only the most recent init keeps a zoom watcher.
                        if (!this._initialized) return;
                        this.zoom = this.whiteboard.zoom;
                        this._zoomRafId = requestAnimationFrame(updateZoom);
                    };
                    updateZoom();

                    try {
                        // Connect to socket
                        await this.syncManager.connect();
                        this.connected = true;

                        // Load existing strokes
                        await this.syncManager.loadDocument();
                    } catch (error) {
                        console.error('Failed to initialize:', error);
                    }

                    this.loading = false;

                    // Keyboard shortcuts
                    document.addEventListener('keydown', (e) => {
                        if (e.target.tagName === 'INPUT') return;
                        if (e.key === 'd' || e.key === 'D') this.setMode('draw');
                        if (e.key === 'e' || e.key === 'E') this.setMode('erase');
                        if (e.key === 'v' || e.key === 'V') this.setMode('select');
                        if (e.key === 'h' || e.key === 'H') this.setMode('pan');
                        if (e.key === 'g' || e.key === 'G') this.toggleGrid();
                    });
                },

                setMode(mode) {
                    this.mode = mode;
                    this.whiteboard.setMode(mode);
                },

                setColor(color) {
                    this.color = color;
                    this.whiteboard.setColor(color);
                },

                setStrokeWidth(width) {
                    this.strokeWidth = parseInt(width);
                    this.whiteboard.setStrokeWidth(this.strokeWidth);
                },

                setBackgroundColor(color) {
                    this.backgroundColor = color;
                    if (this.whiteboard) {
                        this.whiteboard.setBackgroundColor(color);
                    }
                },

                toggleGrid() {
                    this.showGrid = !this.showGrid;
                    if (this.whiteboard) {
                        this.whiteboard.setShowGrid(this.showGrid);
                    }
                },

                zoomIn() {
                    this.whiteboard.zoomIn();
                    this.zoom = this.whiteboard.zoom;
                },

                zoomOut() {
                    this.whiteboard.zoomOut();
                    this.zoom = this.whiteboard.zoom;
                },

                resetZoom() {
                    this.whiteboard.resetZoom();
                    this.zoom = this.whiteboard.zoom;
                },

                async clearCanvas() {
                    if (confirm('Clear the entire canvas?')) {
                        this.whiteboard.clear();
                        await this.syncManager.clearDocument();
                    }
                },

                uploadImage(event) {
                    const file = event.target.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.whiteboard.addImageFromFile(file);
                    }
                    // Reset input so the same file can be selected again
                    event.target.value = '';
                },

                // Sanitize user name to prevent XSS (defense in depth)
                sanitizeUserName(name) {
                    if (!name) return '';
                    // Remove HTML-like content and control characters
                    return name
                        .replace(/[<>]/g, '')           // Remove angle brackets
                        .replace(/[^\x20-\x7E\u00A0-\uFFFF]/g, '') // Only printable chars
                        .trim()
                        .substring(0, 50);              // Max 50 characters
                },

                async setUserName() {
                    let name = this.userNameInput.trim();
                    if (!name) return;
                    
                    // Sanitize the name
                    name = this.sanitizeUserName(name);
                    if (!name) return;
                    
                    this.userName = name;
                    this.userNameInput = '';
                    localStorage.setItem('whiteboardUserName', name);
                    
                    // If whiteboard is already initialized, just update the name
                    if (this.syncManager) {
                        this.syncManager.setUserName(name);
                    } else {
                        // Start the whiteboard now that we have a name
                        await this.startWhiteboard();
                    }
                },

                toggleUserPanel() {
                    this.userPanelExpanded = !this.userPanelExpanded;
                },

                editUserName() {
                    // Clear stored name and show the name entry modal
                    this.userNameInput = this.userName;
                    this.userName = '';
                    localStorage.removeItem('whiteboardUserName');
                },

                jumpToUser(userId) {
                    if (this.whiteboard.jumpToUser(userId)) {
                        this.zoom = this.whiteboard.zoom;
                    }
                }
            };
        }
    </script>
</body>

</html>
