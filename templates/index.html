<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Whiteboard</title>

    <!-- Tailwind CSS (local) -->
    <script src="/static/js/vendor/tailwind.js"></script>

    <!-- Whiteboard CSS -->
    <link rel="stylesheet" href="/static/css/whiteboard.css">

    <!-- Alpine.js (local) -->
    <script defer src="/static/js/vendor/alpine.min.js"></script>

    <!-- Socket.IO (local) -->
    <script src="/static/js/vendor/socket.io.min.js"></script>

    <!-- Perfect Freehand - Load via ES module (local) -->
    <script type="module">
        import { getStroke } from '/static/js/vendor/perfect-freehand.mjs';
        window.getStroke = getStroke;
        window.dispatchEvent(new Event('perfect-freehand-ready'));
    </script>

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css"
    />

</head>

<body class="bg-gray-100 overflow-hidden">
    <!-- Main Whiteboard Component -->
    <div x-data="whiteboardApp()" x-init="init()" class="whiteboard-container" :data-mode="mode">

        <!-- Dual Canvas System -->
        <canvas x-ref="baseCanvas" class="whiteboard-canvas whiteboard-canvas--base"></canvas>
        <canvas x-ref="activeCanvas" class="whiteboard-canvas whiteboard-canvas--active"></canvas>

        <!-- Floating Tool Palette - Swiss + Whiteboard Style -->
        <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50">
            <div class="flex items-center bg-white shadow-xl" style="border: 2px solid #1e1e1e; transform: rotate(-0.3deg);">
                <!-- Red accent bar -->
                <div class="w-1.5 h-12 bg-red-500 self-stretch"></div>

                <!-- Tool Selection -->
                <div class="flex items-center gap-0.5 px-2 py-1.5">
                    <button @click="setMode('draw')"
                        :class="mode === 'draw' ? 'bg-yellow-400 text-gray-900' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 transition-all duration-150" 
                        :style="mode === 'draw' ? 'border: 2px solid #1e1e1e; transform: rotate(-2deg);' : 'border: 2px solid transparent;'"
                        title="Draw (D)">
                        <i class="ph ph-pencil-simple text-xl"></i>
                    </button>
                    <button @click="setMode('erase')"
                        :class="mode === 'erase' ? 'bg-yellow-400 text-gray-900' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 transition-all duration-150"
                        :style="mode === 'erase' ? 'border: 2px solid #1e1e1e; transform: rotate(1deg);' : 'border: 2px solid transparent;'"
                        title="Eraser (E)">
                        <i class="ph ph-eraser text-xl"></i>
                    </button>
                    <button @click="setMode('select')"
                        :class="mode === 'select' ? 'bg-yellow-400 text-gray-900' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 transition-all duration-150"
                        :style="mode === 'select' ? 'border: 2px solid #1e1e1e; transform: rotate(-1deg);' : 'border: 2px solid transparent;'"
                        title="Select (V)">
                        <i class="ph ph-cursor text-xl"></i>
                    </button>
                    <button @click="setMode('pan')"
                        :class="mode === 'pan' ? 'bg-yellow-400 text-gray-900' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 transition-all duration-150"
                        :style="mode === 'pan' ? 'border: 2px solid #1e1e1e; transform: rotate(2deg);' : 'border: 2px solid transparent;'"
                        title="Pan (H)">
                        <i class="ph ph-hand text-xl"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="w-0.5 h-8 bg-gray-900 mx-1"></div>

                <!-- Stroke Color -->
                <div class="flex items-center gap-1 px-2">
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" 
                            class="w-8 h-8 border-2 border-gray-900 hover:scale-105 transition-transform flex items-center justify-center"
                            :style="{ backgroundColor: color, transform: 'rotate(2deg)' }">
                        </button>
                        <!-- Color Dropdown -->
                        <div x-show="open" @click.outside="open = false" x-transition
                            class="absolute top-full left-0 mt-2 p-4 bg-white shadow-xl z-50 min-w-[220px]"
                            style="border: 2px solid #1e1e1e; transform: rotate(-0.5deg);">
                            <p class="text-xs font-bold text-gray-900 uppercase tracking-wider mb-3">Stroke Color</p>
                            <div class="grid grid-cols-5 gap-2 mb-4">
                                <template x-for="c in colorPalette" :key="c">
                                    <button @click="setColor(c); open = false" 
                                        :style="{ backgroundColor: c }"
                                        :class="color === c ? 'ring-2 ring-gray-900 ring-offset-2' : ''"
                                        class="w-9 h-9 border-2 border-gray-900 hover:scale-110 transition-transform cursor-pointer">
                                    </button>
                                </template>
                            </div>
                            <div class="pt-3 border-t-2 border-gray-900">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <span class="text-xs font-bold text-gray-900 uppercase">Custom:</span>
                                    <input type="color" x-model="color" @input="setColor($event.target.value)"
                                        class="w-10 h-8 cursor-pointer border-2 border-gray-900">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="w-0.5 h-8 bg-gray-900 mx-1"></div>

                <!-- Stroke Width Presets -->
                <div class="flex items-center gap-1 px-2">
                    <template x-for="sw in strokeWidths" :key="sw.value">
                        <button @click="setStrokeWidth(sw.value)"
                            :class="strokeWidth == sw.value ? 'bg-blue-500 text-white' : 'hover:bg-gray-100 text-gray-700'"
                            class="w-9 h-9 transition-all duration-150 flex items-center justify-center"
                            :style="strokeWidth == sw.value ? 'border: 2px solid #1e1e1e;' : 'border: 2px solid transparent;'"
                            :title="sw.label">
                            <div class="rounded-full bg-current" :style="{ width: sw.size + 'px', height: sw.size + 'px' }"></div>
                        </button>
                    </template>
                </div>

                <!-- Divider -->
                <div class="w-0.5 h-8 bg-gray-900 mx-1"></div>

                <!-- Canvas Options -->
                <div class="flex items-center gap-0.5 px-2">
                    <!-- Background Color -->
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" 
                            :class="backgroundColor !== '#ffffff' ? 'bg-yellow-400 text-gray-900' : 'hover:bg-gray-100 text-gray-600'"
                            class="p-2.5 transition-all duration-150"
                            :style="backgroundColor !== '#ffffff' ? 'border: 2px solid #1e1e1e;' : 'border: 2px solid transparent;'"
                            title="Background Color">
                            <i class="ph ph-paint-bucket text-xl"></i>
                        </button>
                        <!-- Background Color Dropdown -->
                        <div x-show="open" @click.outside="open = false" x-transition
                            class="absolute top-full right-0 mt-2 p-3 bg-white shadow-xl z-50 min-w-[180px]"
                            style="border: 2px solid #1e1e1e; transform: rotate(0.5deg);">
                            <p class="text-xs font-bold text-gray-900 uppercase tracking-wider mb-2">Background</p>
                            <div class="grid grid-cols-5 gap-1.5">
                                <template x-for="bg in backgroundColors" :key="bg">
                                    <button @click="setBackgroundColor(bg); open = false" 
                                        :style="{ backgroundColor: bg }"
                                        :class="[
                                            backgroundColor === bg ? 'ring-2 ring-gray-900 ring-offset-1' : '',
                                            bg === '#ffffff' ? 'border-2 border-gray-900' : 'border-2 border-gray-900'
                                        ]"
                                        class="w-7 h-7 hover:scale-110 transition-transform">
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                    <!-- Grid Toggle -->
                    <button @click="toggleGrid()"
                        :class="showGrid ? 'bg-yellow-400 text-gray-900' : 'hover:bg-gray-100 text-gray-600'"
                        class="p-2.5 transition-all duration-150"
                        :style="showGrid ? 'border: 2px solid #1e1e1e; transform: rotate(-1deg);' : 'border: 2px solid transparent;'"
                        title="Toggle Grid (G)">
                        <i class="ph ph-grid-four text-xl"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="w-0.5 h-8 bg-gray-900 mx-1"></div>

                <!-- Zoom Controls -->
                <div class="flex items-center gap-0.5 px-2">
                    <button @click="zoomOut()" class="p-2 hover:bg-gray-100 text-gray-700 transition-colors border-2 border-transparent hover:border-gray-300">
                        <i class="ph ph-minus text-lg"></i>
                    </button>
                    <button @click="resetZoom()" 
                        class="px-2 py-1 hover:bg-gray-100 text-gray-900 text-xs font-bold min-w-[50px] transition-colors uppercase tracking-wide"
                        x-text="Math.round(zoom * 100) + '%'">
                    </button>
                    <button @click="zoomIn()" class="p-2 hover:bg-gray-100 text-gray-700 transition-colors border-2 border-transparent hover:border-gray-300">
                        <i class="ph ph-plus text-lg"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="w-0.5 h-8 bg-gray-900 mx-1"></div>

                <!-- Actions -->
                <div class="flex items-center gap-0.5 px-2">
                    <input type="file" x-ref="imageInput" @change="uploadImage($event)" accept="image/*" class="hidden">
                    <button @click="$refs.imageInput.click()" 
                        class="p-2.5 hover:bg-gray-100 text-gray-600 transition-colors border-2 border-transparent hover:border-gray-300"
                        title="Add Image (Ctrl+V to paste)">
                        <i class="ph ph-image text-xl"></i>
                    </button>
                    <button @click="clearCanvas()" 
                        class="p-2.5 hover:bg-red-500 text-gray-600 hover:text-white transition-colors border-2 border-transparent hover:border-gray-900"
                        title="Clear Canvas">
                        <i class="ph ph-trash text-xl"></i>
                    </button>
                </div>

                <!-- Blue accent bar -->
                <div class="w-1.5 h-12 bg-blue-500 self-stretch"></div>
            </div>
        </div>

        <!-- Connection Status - Swiss Style -->
        <div class="fixed bottom-4 left-4 z-50">
            <div class="flex items-center gap-2 px-3 py-2 bg-white shadow-lg text-sm"
                style="border: 2px solid #1e1e1e; transform: rotate(-1deg);"
                :class="connected ? 'text-emerald-600' : 'text-gray-400'">
                <div class="w-2.5 h-2.5" :class="connected ? 'bg-emerald-500' : 'bg-gray-400'"></div>
                <span class="font-bold uppercase tracking-wider text-xs" x-text="connected ? 'Online' : 'Offline'"></span>
            </div>
        </div>

        <!-- User Panel (bottom right) - Swiss + Whiteboard Style -->
        <div class="fixed bottom-4 right-4 z-50" x-show="userName">
            <!-- Connected users panel -->
            <div class="bg-white shadow-xl overflow-hidden min-w-[220px]" style="border: 2px solid #1e1e1e; transform: rotate(0.5deg);">
                <!-- Header with your name -->
                <div class="px-3 py-2.5 bg-yellow-400 border-b-2 border-gray-900 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 border-2 border-gray-900" :style="{ backgroundColor: userColor }"></div>
                        <span class="text-sm font-bold text-gray-900 uppercase tracking-wide" x-text="userName"></span>
                        <span class="text-xs text-gray-700 font-medium">(you)</span>
                        <button @click="editUserName()" 
                            class="p-1 text-gray-700 hover:text-gray-900 transition-colors"
                            title="Edit name">
                            <i class="ph ph-pencil-simple text-sm"></i>
                        </button>
                    </div>
                    <button @click="toggleUserPanel()" 
                        class="text-gray-900 hover:text-gray-700 transition-colors">
                        <i class="ph ph-caret-down text-lg transition-transform" :class="userPanelExpanded ? 'rotate-180' : ''"></i>
                    </button>
                </div>

                <!-- User list -->
                <div x-show="userPanelExpanded" x-transition class="max-h-48 overflow-y-auto bg-white">
                    <template x-if="remoteUsers.length === 0">
                        <div class="px-3 py-3 text-sm text-gray-500 text-center font-medium">
                            No other users online
                        </div>
                    </template>
                    <template x-for="user in remoteUsers" :key="user.oduserId">
                        <div class="px-3 py-2 flex items-center justify-between hover:bg-gray-50 border-b-2 border-gray-200 last:border-b-0">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 border-2 border-gray-900" :style="{ backgroundColor: user.color }"></div>
                                <span class="text-sm text-gray-700 font-medium" x-text="user.name"></span>
                            </div>
                            <button @click="jumpToUser(user.oduserId)" 
                                class="p-1 text-gray-500 hover:text-red-500 transition-colors"
                                title="Jump to user's location">
                                <i class="ph ph-map-pin text-base"></i>
                            </button>
                        </div>
                    </template>
                </div>

                <!-- Bottom accent -->
                <div class="flex">
                    <div class="flex-1 h-1 bg-red-500"></div>
                    <div class="flex-1 h-1 bg-blue-500"></div>
                    <div class="flex-1 h-1 bg-gray-900"></div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay - Swiss Style -->
        <div x-show="loading && userName" x-transition class="absolute inset-0 flex items-center justify-center z-50" style="background: #f5f5f0;">
            <div class="text-center bg-white p-8 shadow-xl" style="border: 3px solid #1e1e1e; transform: rotate(-0.5deg);">
                <div class="h-1.5 bg-red-500 -mt-8 -mx-8 mb-6"></div>
                <div class="w-12 h-12 border-4 border-gray-200 border-t-gray-900 animate-spin mx-auto"></div>
                <p class="mt-4 text-gray-900 font-bold uppercase tracking-wider text-sm">Loading whiteboard...</p>
                <div class="flex -mx-8 -mb-8 mt-6">
                    <div class="flex-1 h-1.5 bg-blue-500"></div>
                    <div class="flex-1 h-1.5 bg-yellow-400"></div>
                    <div class="flex-1 h-1.5 bg-gray-900"></div>
                </div>
            </div>
        </div>

        <!-- Name Entry Modal (shown before whiteboard) -->
        <div x-show="!userName" class="absolute inset-0 flex items-center justify-center z-[100]" style="background: #f5f5f0;">
            <!-- Swiss-style geometric decorations -->
            <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
                <!-- Bold geometric shapes -->
                <div class="absolute top-12 left-12 w-24 h-24 bg-red-500 opacity-90" style="transform: rotate(12deg);"></div>
                <div class="absolute top-32 right-20 w-16 h-16 bg-yellow-400 rounded-full opacity-90"></div>
                <div class="absolute bottom-20 left-24 w-20 h-20 border-4 border-black opacity-60" style="transform: rotate(-8deg);"></div>
                <div class="absolute bottom-32 right-16 w-12 h-32 bg-blue-500 opacity-80" style="transform: rotate(6deg);"></div>
                <div class="absolute top-1/4 right-1/4 w-8 h-8 bg-black rounded-full opacity-70"></div>
                <!-- Playful sketchy lines -->
                <svg class="absolute top-20 left-1/3 w-32 h-8 opacity-40" viewBox="0 0 120 20">
                    <path d="M0,10 Q30,2 60,10 T120,10" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                <svg class="absolute bottom-40 right-1/3 w-24 h-6 opacity-30" viewBox="0 0 100 15">
                    <path d="M0,8 C20,2 40,14 60,8 S80,2 100,8" stroke="#1e1e1e" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Main card with Swiss + whiteboard style -->
            <div class="relative bg-white max-w-md w-full mx-4 shadow-2xl" style="border: 3px solid #1e1e1e; transform: rotate(-0.5deg);">
                <!-- Top accent bar (Swiss style) -->
                <div class="h-2 bg-red-500"></div>
                
                <div class="p-8">
                    <!-- Header with bold Swiss typography -->
                    <div class="mb-8">
                        <div class="flex items-start gap-4 mb-4">
                            <!-- Playful icon with sketchy border -->
                            <div class="relative flex-shrink-0">
                                <div class="w-14 h-14 bg-yellow-400 flex items-center justify-center" style="border: 2px solid #1e1e1e; transform: rotate(3deg);">
                                    <i class="ph ph-pencil-line text-2xl text-gray-900"></i>
                                </div>
                            </div>
                            <div>
                                <h1 class="text-3xl font-black text-gray-900 tracking-tight leading-tight" style="font-family: system-ui, -apple-system, sans-serif;">
                                    Welcome to<br>the Whiteboard
                                </h1>
                            </div>
                        </div>
                        <p class="text-gray-600 text-sm uppercase tracking-widest font-medium">Enter your name to collaborate</p>
                    </div>

                    <div class="space-y-6">
                        <!-- Name input with sketchy underline style -->
                        <div>
                            <label class="block text-xs font-bold text-gray-900 uppercase tracking-wider mb-2">Your Name</label>
                            <div class="relative">
                                <input type="text" 
                                    x-ref="nameInput"
                                    x-model="userNameInput" 
                                    @keydown.enter="setUserName()"
                                    placeholder="Type here..."
                                    class="w-full px-0 py-3 bg-transparent border-0 border-b-3 border-gray-900 focus:outline-none focus:border-red-500 text-xl font-medium placeholder-gray-300 transition-colors"
                                    style="border-bottom: 3px solid #1e1e1e;">
                                <!-- Decorative pencil mark -->
                                <svg class="absolute -right-2 bottom-0 w-6 h-6 text-gray-300" viewBox="0 0 24 24">
                                    <path d="M4,20 Q12,18 20,20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>

                        <!-- Fun name suggestions with playful pill style -->
                        <div>
                            <label class="block text-xs font-bold text-gray-900 uppercase tracking-wider mb-3">Or pick a fun name</label>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="animal in suggestedNames" :key="animal">
                                    <button @click="userNameInput = animal" 
                                        :class="userNameInput === animal ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-700 border-gray-900 hover:bg-gray-100'"
                                        class="px-4 py-1.5 text-sm font-semibold border-2 transition-all duration-150"
                                        :style="userNameInput === animal ? 'transform: rotate(-2deg) scale(1.05);' : 'transform: rotate(' + (Math.random() * 4 - 2) + 'deg);'">
                                        <span x-text="animal"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Bold Swiss-style CTA button -->
                        <button @click="setUserName()" 
                            :disabled="!userNameInput.trim()"
                            :class="userNameInput.trim() ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-gray-200 text-gray-400 cursor-not-allowed'"
                            class="w-full py-4 font-black text-lg uppercase tracking-wider transition-all duration-150 mt-6"
                            :style="userNameInput.trim() ? 'border: 3px solid #1e1e1e; transform: rotate(0.5deg);' : 'border: 3px solid #e5e5e5;'">
                            Join Whiteboard →
                        </button>
                    </div>
                </div>

                <!-- Bottom decorative element -->
                <div class="flex">
                    <div class="flex-1 h-3 bg-blue-500"></div>
                    <div class="flex-1 h-3 bg-yellow-400"></div>
                    <div class="flex-1 h-3 bg-gray-900"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Whiteboard & Sync Scripts -->
    <script src="/static/js/whiteboard.js"></script>
    <script src="/static/js/sync.js"></script>

    <script>
        // Alpine.js Component
        function whiteboardApp() {
            return {
                // State
                whiteboard: null,
                syncManager: null,
                tokenId: '{{ token_id }}',

                // UI State
                mode: 'draw',
                color: '#1e1e1e',
                strokeWidth: 2,
                zoom: 1,
                connected: false,
                loading: true,
                showGrid: true,
                backgroundColor: '#ffffff',

                // User state
                userName: '',  // Will be set in init() with sanitization
                userNameInput: '',
                userColor: '#3b82f6',
                remoteUsers: [],
                userPanelExpanded: true,

                // Suggested rare animal names
                suggestedNames: [
                    'Axolotl', 'Quokka', 'Pangolin', 'Okapi', 'Narwhal',
                    'Kakapo', 'Fossa', 'Dugong', 'Saola', 'Tarsier'
                ],

                // Extended color palette (Excalidraw-style)
                colorPalette: [
                    // Row 1 - Dark shades
                    '#1e1e1e', '#e03131', '#2f9e44', '#1971c2', '#9c36b5',
                    // Row 2 - Medium shades  
                    '#868e96', '#f08c00', '#0c8599', '#6741d9', '#c2255c',
                    // Row 3 - Light shades
                    '#ced4da', '#ffd43b', '#a9e34b', '#66d9e8', '#e599f7',
                ],

                // Background color options
                backgroundColors: [
                    '#ffffff', '#f8f9fa', '#fff5f5', '#f3f0ff', '#e7f5ff',
                    '#ebfbee', '#fff9db', '#343a40', '#212529', '#0d0d0d',
                ],

                // Stroke width presets
                strokeWidths: [
                    { value: 1, size: 4, label: 'Extra thin' },
                    { value: 2, size: 6, label: 'Thin' },
                    { value: 4, size: 8, label: 'Medium' },
                    { value: 8, size: 12, label: 'Thick' },
                    { value: 16, size: 16, label: 'Extra thick' },
                ],

                async init() {
                    // Load and sanitize stored user name
                    const storedName = localStorage.getItem('whiteboardUserName');
                    if (storedName) {
                        this.userName = this.sanitizeUserName(storedName);
                        // Update storage if sanitization changed the name
                        if (this.userName !== storedName) {
                            localStorage.setItem('whiteboardUserName', this.userName);
                        }
                    }

                    // Wait for perfect-freehand to be loaded
                    if (typeof getStroke !== 'function') {
                        await new Promise(resolve => {
                            window.addEventListener('perfect-freehand-ready', resolve, { once: true });
                            // Fallback timeout in case event already fired
                            setTimeout(resolve, 1000);
                        });
                    }

                    // If user already has a name saved, start the whiteboard
                    if (this.userName) {
                        await this.startWhiteboard();
                    }
                },

                async startWhiteboard() {
                    // Guard against accidental double-initialization.
                    // This can happen during dev (Flask debug reloader / hot reload) or if Alpine is started twice.
                    if (this._initialized) return;
                    this._initialized = true;

                    // Initialize Whiteboard
                    this.whiteboard = new Whiteboard(
                        this.$refs.baseCanvas,
                        this.$refs.activeCanvas,
                        { color: this.color, strokeWidth: this.strokeWidth }
                    );

                    // Initialize SyncManager with user info
                    this.syncManager = new SyncManager(this.whiteboard, this.tokenId, {
                        userName: this.userName
                    });

                    // Get user color from whiteboard
                    this.userColor = this.whiteboard.localUserColor;

                    // Update remote users list periodically
                    setInterval(() => {
                        if (this.whiteboard) {
                            this.remoteUsers = this.whiteboard.getRemoteUsers();
                        }
                    }, 500);

                    // Watch for zoom changes
                    const updateZoom = () => {
                        // If init ran twice somehow, the first loop will still be running.
                        // Bail out so only the most recent init keeps a zoom watcher.
                        if (!this._initialized) return;
                        this.zoom = this.whiteboard.zoom;
                        this._zoomRafId = requestAnimationFrame(updateZoom);
                    };
                    updateZoom();

                    try {
                        // Connect to socket
                        await this.syncManager.connect();
                        this.connected = true;

                        // Load existing strokes
                        await this.syncManager.loadDocument();
                    } catch (error) {
                        console.error('Failed to initialize:', error);
                    }

                    this.loading = false;

                    // Keyboard shortcuts
                    document.addEventListener('keydown', (e) => {
                        if (e.target.tagName === 'INPUT') return;
                        if (e.key === 'd' || e.key === 'D') this.setMode('draw');
                        if (e.key === 'e' || e.key === 'E') this.setMode('erase');
                        if (e.key === 'v' || e.key === 'V') this.setMode('select');
                        if (e.key === 'h' || e.key === 'H') this.setMode('pan');
                        if (e.key === 'g' || e.key === 'G') this.toggleGrid();
                    });
                },

                setMode(mode) {
                    this.mode = mode;
                    this.whiteboard.setMode(mode);
                },

                setColor(color) {
                    this.color = color;
                    this.whiteboard.setColor(color);
                },

                setStrokeWidth(width) {
                    this.strokeWidth = parseInt(width);
                    this.whiteboard.setStrokeWidth(this.strokeWidth);
                },

                setBackgroundColor(color) {
                    this.backgroundColor = color;
                    if (this.whiteboard) {
                        this.whiteboard.setBackgroundColor(color);
                    }
                },

                toggleGrid() {
                    this.showGrid = !this.showGrid;
                    if (this.whiteboard) {
                        this.whiteboard.setShowGrid(this.showGrid);
                    }
                },

                zoomIn() {
                    this.whiteboard.zoomIn();
                    this.zoom = this.whiteboard.zoom;
                },

                zoomOut() {
                    this.whiteboard.zoomOut();
                    this.zoom = this.whiteboard.zoom;
                },

                resetZoom() {
                    this.whiteboard.resetZoom();
                    this.zoom = this.whiteboard.zoom;
                },

                async clearCanvas() {
                    if (confirm('Clear the entire canvas?')) {
                        this.whiteboard.clear();
                        await this.syncManager.clearDocument();
                    }
                },

                uploadImage(event) {
                    const file = event.target.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.whiteboard.addImageFromFile(file);
                    }
                    // Reset input so the same file can be selected again
                    event.target.value = '';
                },

                // Sanitize user name to prevent XSS (defense in depth)
                sanitizeUserName(name) {
                    if (!name) return '';
                    // Remove HTML-like content and control characters
                    return name
                        .replace(/[<>]/g, '')           // Remove angle brackets
                        .replace(/[^\x20-\x7E\u00A0-\uFFFF]/g, '') // Only printable chars
                        .trim()
                        .substring(0, 50);              // Max 50 characters
                },

                async setUserName() {
                    let name = this.userNameInput.trim();
                    if (!name) return;
                    
                    // Sanitize the name
                    name = this.sanitizeUserName(name);
                    if (!name) return;
                    
                    this.userName = name;
                    this.userNameInput = '';
                    localStorage.setItem('whiteboardUserName', name);
                    
                    // If whiteboard is already initialized, just update the name
                    if (this.syncManager) {
                        this.syncManager.setUserName(name);
                    } else {
                        // Start the whiteboard now that we have a name
                        await this.startWhiteboard();
                    }
                },

                toggleUserPanel() {
                    this.userPanelExpanded = !this.userPanelExpanded;
                },

                editUserName() {
                    // Clear stored name and show the name entry modal
                    this.userNameInput = this.userName;
                    this.userName = '';
                    localStorage.removeItem('whiteboardUserName');
                },

                jumpToUser(userId) {
                    if (this.whiteboard.jumpToUser(userId)) {
                        this.zoom = this.whiteboard.zoom;
                    }
                }
            };
        }
    </script>
</body>

</html>
